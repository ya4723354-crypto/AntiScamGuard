name: 打包 APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 解壓縮並打包
        run: |
          if ! ls *.zip >/dev/null 2>&1; then echo "還沒上傳 zip"; exit 0; fi
          mkdir src
          for z in *.zip; do unzip -q "$z" -d src; done
          cd "$(dirname "$(find src -name gradlew -type f | head -1)")"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: AntiScamGuard-apk
          path: app-debug.apk
          if-no-files-found: ignore
